    "@vuepress/plugin-markdown-tab": 2.0.0-rc.138
    "@vuepress/plugin-media": 2.0.0-rc.138
    "@vuepress/plugin-meilisearch": 2.0.0-rc.138
    "@vuepress/plugin-notice": 2.0.0-rc.138
    "@vuepress/plugin-nprogress": 2.0.0-rc.138
    "@vuepress/plugin-orama": 2.0.0-rc.138
