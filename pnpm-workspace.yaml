packages:
  - demo/*
  - docs/*
  - packages/*

allowBuilds:
  "@parcel/watcher": true
  esbuild: true
  unrs-resolver: true

catalog:
  "@markmap/parse": 1.1.0
  "@markmap/plugin-math": 1.1.0
  "@markmap/render": 1.1.0
  "@markmap/toolbar": 1.1.0
  "@markmap/view": 1.1.0
  "@mathjax/src": 4.1.3
  "@vueuse/core": 15.0.0
  mermaid: 12.3.0
  reveal.js: 6.0.2
  typescript: 6.0.3
  sass-embedded: ^1.108.2
  sass-loader: ^17.1.0
  vue: ^3.5.45

catalogs:
  range:
    "@vueuse/core": ^15.0.0
    balloon-css: ^1.2.0
    sass: ^1.108.2
    sass-embedded: ^1.108.2
    sass-loader: ^17.1.0
    vue: ^3.5.45

  vuepress:
    "@vuepress/bundler-rspack": 2.0.0-rc.32
    "@vuepress/bundler-vite": 2.0.0-rc.32
    "@vuepress/bundler-webpack": 2.0.0-rc.32
    "@vuepress/helper": 2.0.0-rc.138
