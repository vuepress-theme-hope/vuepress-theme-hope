peerDependencyRules:
  allowedVersions:
    "echarts-wordcloud>echarts": "6"
  ignoreMissing:
    - echarts

# virtualStoreType: global

blockExoticSubdeps: false
minimumReleaseAgeExclude:
  - "@mdit/*"
  - "@mr-hope/*"
  - "@oxfmt/*"
  - "@oxlint/*"
  - "@vuepress/*"
  - "@waline/*"
  - "bcrypt-ts"
  - "oxc-config-hope"
  - "oxfmt"
  - "oxlint"
  - "stylelint-config-hope"
  - "vuepress"
  - "vuepress-*"
minimumReleaseAgeExcludePrune: true
trustPolicy: no-downgrade
trustPolicyIgnoreAfter: 720
trustPolicyExcludePrune: true
