name: Linter and Unit Test

on:
  - workflow_call

permissions:
  contents: read

jobs:
  linter-and-unit:
    name: Linter and Unit test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/setup@v2
        with:
          runtime: node@^24.18.0

      - name: Install deps
        run: pnpm ci

      - name: Build project
        run: pnpm run build

      - name: Linter test
        env:
          NODE_OPTIONS: --max_old_space_size=8192
        run: |
          pnpm run lint:check
          pnpm run lint:md

      - name: Unit test
        env:
          NODE_OPTIONS: --max_old_space_size=8192
        run: pnpm run test

      - name: Upload coverage
        uses: codecov/codecov-action@v7
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
