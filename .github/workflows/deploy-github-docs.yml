name: Deploy Github Docs

on:
  workflow_call:
    secrets:
      ACCESS_TOKEN:
        required: true

permissions:
  contents: read

jobs:
  deploy-github-pages:
    name: Deploy Docs to GitHub pages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/setup@v2
        with:
          runtime: node@^24.18.0

      - name: Install deps
        run: pnpm ci

      - name: Build project
        run: pnpm run build

      - name: Docs build
        env:
          NODE_OPTIONS: --max_old_space_size=8192
        run: pnpm run docs:vite-build

      - name: Combine output
        run: |
          mkdir -p dist/components
          mkdir -p dist/lightgallery
          mkdir -p dist/md-enhance
          cp -r docs/components/dist/* dist/components/
          cp -r docs/lightgallery/dist/* dist/lightgallery/
          cp -r docs/md-enhance/dist/* dist/md-enhance/
          cp -r docs/theme/dist/* dist/

      - name: Deploy
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          repository-name: vuepress-theme-hope/v2
          branch: gh-pages
          folder: dist
          token: ${{ secrets.ACCESS_TOKEN }}
          single-commit: true
