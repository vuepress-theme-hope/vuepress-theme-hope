name: Demo Test

on:
  workflow_call:
    inputs:
      # controls whether to test demos in all environments
      strict-checking:
        type: boolean

permissions:
  contents: read

jobs:
  test-demos:
    strategy:
      fail-fast: false
      matrix:
        bundler:
          - vite
          - webpack
    name: Test demos using ${{ matrix.bundler }}
    runs-on: ubuntu-latest
    if: inputs.strict-checking == false
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/setup@v2
        with:
          runtime: node@^24.18.0

      - name: Install deps
        run: pnpm ci

      - name: Build project
        run: pnpm run build

      - name: ${{ matrix.bundler }} build test
        env:
          NODE_OPTIONS: --max_old_space_size=8192
        run: |
          pnpm run -r demo:${{ matrix.bundler }}-build

  test-docs:
    name: Test docs
    runs-on: ubuntu-latest
    if: inputs.strict-checking == true
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/setup@v2
        with:
          runtime: node@^24.18.0

      - name: Install deps
        run: pnpm ci

      - name: Build project
        run: pnpm run build

      - name: Docs build
        env:
          NODE_OPTIONS: --max_old_space_size=8192
        run: pnpm run docs:vite-build

  strict-test-demos:
    strategy:
      fail-fast: false
      matrix:
        node:
          - 22
          - 24
          - 26
        bundler:
          - vite
          - webpack
        env:
          - ubuntu-latest
          - windows-latest
          - macos-latest
    name: Test demos using ${{ matrix.bundler }} with node ${{ matrix.node }} on ${{ matrix.env }}
    runs-on: ${{ matrix.env }}
    if: inputs.strict-checking == true
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/setup@v2
        with:
          runtime: node@${{ matrix.node }}

      - name: Install deps
        run: pnpm ci

      - name: Build project
        run: pnpm run build

      - name: ${{ matrix.bundler }} build test
        env:
          NODE_OPTIONS: --max_old_space_size=8192
        run: |
          pnpm run -r demo:${{ matrix.bundler }}-build
