name: Deploy GitHub Demo

on:
  workflow_call:
    secrets:
      ACCESS_TOKEN:
        required: true

permissions:
  contents: read

jobs:
  deploy-demo-to-gh-pages:
    name: Deploy demo to GitHub Pages
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        name:
          - blog
          - docs
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/setup@v2
        with:
          runtime: node@^24.18.0

      - name: Install deps
        run: pnpm ci

      - name: Build project
        run: pnpm run build

      - name: Build GitHub Pages Demo
        env:
          BASE: /${{ matrix.name }}-demo/
          HOSTNAME: https://vuepress-theme-hope.github.io/
          NODE_OPTIONS: --max_old_space_size=8192
        run: |-
          pnpm --filter theme-${{ matrix.name }}-demo demo:vite-build
          > demo/theme-${{ matrix.name }}/dist/.nojekyll

      - name: Deploy to gh pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          repository-name: vuepress-theme-hope/${{ matrix.name }}-demo
          branch: gh-pages
          folder: demo/theme-${{ matrix.name }}/dist
          token: ${{ secrets.ACCESS_TOKEN }}
          single-commit: true
